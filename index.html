<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b13">
<title>MISK IT | لوحة التحكم</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/legacy.css">
<link rel="stylesheet" href="assets/dashboard.css">
<link rel="stylesheet" href="assets/workspaces.css">
<style>
  .tabs { display:flex; justify-content:center; gap:8px; padding:12px; background:#fff; border-top:1px solid #eee; position:fixed; bottom:0; left:0; right:0; }
  .tabs div { padding:10px 18px; border-radius:12px; background:#7c3aed; color:#fff; font-weight:900; font-size:15px; cursor:pointer; text-align:center; }
  .empty-box { background:#fff; border-radius:16px; padding:24px; min-height:280px; text-align:center; color:#666; margin:12px; }
</style>
</head>
<body>

<!-- صفحة الدخول زي ما هي بالظبط -->
<section id="loginPage" class="login-scene">
  <div class="login-card glass">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>MISK IT<small>INFORMATION TECHNOLOGY</small></span></a>
    <span class="eyebrow">YOUR WORKSPACE, CONNECTED</span>
    <h1>مرحبًا بعودتك</h1>
    <p>سجّل دخولك لإدارة عملياتك من مكان واحد</p>
    <form onsubmit="event.preventDefault();doLogin()">
      <label for="user">اسم المستخدم</label>
      <input id="user" autocomplete="username" required placeholder="اسم المستخدم أو رقم الهاتف">
      <label for="pass">كلمة المرور</label>
      <input id="pass" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
      <button class="primary" type="submit">تسجيل الدخول <span>←</span></button>
      <p id="loginMsg" role="alert"></p>
    </form>
    <a class="preview-link" href="preview.html">استكشف معاينة التصميم ←</a>
    <footer>منصة MISK IT لإدارة العمليات</footer>
  </div>
</section>

<!-- الداشبورد بنفس الاستايل -->
<div id="appPage" class="hidden">
  <div class="top-img legacy-heading">
    <small>☰</small><br><br>
    <b id="welcome" style="font-size:22px">لوحة التحكم</b><br>
    <small id="techInfo">أهلا بيك في MISK IT</small>
    <div style="position:absolute;left:14px;top:14px">🔔</div>
  </div>

  <div class="we-bar"><div class="logo">WE<span>.</span></div><div>🔔</div></div>

  <!-- المحتوى فاضي -->
  <div id="emptyPage" class="empty-box">
    <p>الصفحة فاضية</p>
  </div>

  <!-- الزرار رجع لمكانه الأصلي تحت زي ما كان -->
  <div class="tabs" id="bottomNav">
    <div onclick="showEmpty()"><span style="font-size:20px;display:block">🏠</span>لوحة التحكم</div>
  </div>
</div>

<script>
function doLogin(){
  document.getElementById('loginPage').style.display='none';
  var app = document.getElementById('appPage');
  app.classList.remove('hidden');
  app.style.display='block';
  var u = document.getElementById('user').value || 'أهلا بيك';
  document.getElementById('welcome').textContent = 'لوحة التحكم - ' + u;
}
function showEmpty(){
  document.getElementById('emptyPage').innerHTML = '<p>الصفحة فاضية</p>';
}
</script>
</body>
</html>
