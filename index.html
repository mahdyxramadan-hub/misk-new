<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة المهام</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .app { max-width: 420px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 16px; border: none; background: #2563eb; color: #fff; border-radius: 8px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <div class="app">
    <h2>مهامي اليومية</h2>
    <div class="row">
      <input id="taskInput" type="text" placeholder="أضف مهمة جديدة..." />
      <button onclick="addTask()">إضافة</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = text;
      span.onclick = () => span.classList.toggle("done");

      const delBtn = document.createElement("button");
      delBtn.textContent = "حذف";
      delBtn.style.background = "#dc2626";
      delBtn.onclick = () => li.remove();

      li.append(span, delBtn);
      document.getElementById("taskList").appendChild(li);
      input.value = "";
    }
  </script>
</body>
</html>
