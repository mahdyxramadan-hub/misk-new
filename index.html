<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MISK - Login</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma}body{margin:0;min-height:100vh;background:#0a0a12;color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:380px;background:#15151f;border:1px solid #2a2a3a;border-radius:24px;padding:26px;text-align:center}
.logo{font-size:30px;font-weight:900}.logo span{color:#a855f7}
/* الـ pill */
.tabs{position:relative;display:flex;background:#0a0a12;border-radius:50px;padding:5px;margin:18px 0}
.tabs button{flex:1;background:transparent;border:0;color:#aaa;padding:12px;border-radius:50px;cursor:pointer;position:relative;z-index:1;font-weight:800;font-size:15px}
.tabs button.active{color:#fff}
#pill{position:absolute;top:5px;bottom:5px;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:50px;z-index:0;box-shadow:0 0 20px rgba(168,85,247,.6)}
input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#0a0a12;color:#fff;outline:none}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
</style></head>
<body>
<div class="card">
<div class="logo">MISK <span>Technology</span></div>
<p style="color:#888;font-size:13px">Together for a smarter future</p>

<!-- التبديل بالـ pill -->
<div class="tabs" id="tabs">
  <div id="pill"></div>
  <button class="active" onclick="switchTab(this,'login')">تسجيل الدخول</button>
  <button onclick="switchTab(this,'register')">حساب جديد</button>
</div>

<div id="loginForm">
  <input placeholder="👤 اسم المستخدم">
  <input type="password" placeholder="🔒 كلمة المرور">
  <button class="btn" onclick="alert('تم الدخول')">دخول النظام ←</button>
</div>

<div id="registerForm" style="display:none">
  <input placeholder="👤 الاسم بالكامل">
  <input placeholder="📱 رقم الموبايل">
  <input type="password" placeholder="🔒 كلمة المرور">
  <button class="btn" onclick="alert('تم إنشاء الحساب')">إنشاء حساب ←</button>
</div>
</div>

<script>
const pill = document.getElementById('pill');
const firstBtn = document.querySelector('.tabs button');
function placePill(btn, animate=true){
  const r = btn.getBoundingClientRect();
  const h = btn.parentElement.getBoundingClientRect();
  const to = {left: r.left - h.left, width: r.width};
  if(animate) gsap.to(pill, {left: to.left, width: to.width, duration: 0.55, ease: 'power3.inOut'});
  else gsap.set(pill, {left: to.left, width: to.width});
}
placePill(firstBtn, false);
function switchTab(btn, type){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  placePill(btn);
  document.getElementById('loginForm').style.display = type=='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = type=='register' ? 'block' : 'none';
}
</script>
</body></html>
