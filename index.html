<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03071b">
<title>MISK Technology — نظام الإدارة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03071b;--panel:#07163b;--panel2:#0a1d4b;--line:#245ed1;--cyan:#28d7ff;--purple:#9b4dff;--white:#f5f8ff;--muted:#9bb7e5;--green:#35ef9a;--orange:#ffad32;--red:#ff547d}
html{scroll-behavior:smooth}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 8% 42%,#073b9566 0,transparent 38%),radial-gradient(ellipse at 92% 8%,#47117e55 0,transparent 34%),radial-gradient(ellipse at 50% 110%,#092d7855 0,transparent 46%),linear-gradient(135deg,#020511,#061031 52%,#03051a)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.28;background-image:linear-gradient(#276dff12 1px,transparent 1px),linear-gradient(90deg,#276dff12 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button{border:0}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.screen{display:none;min-height:calc(100vh - 176px);animation:screenIn .4s ease}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.glass{background:linear-gradient(145deg,rgba(8,26,67,.94),rgba(3,10,32,.96));border:1px solid rgba(57,132,255,.62);box-shadow:0 0 22px #075dff24,inset 0 1px 0 #87cfff16;border-radius:18px}
.logo{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 0 12px #278dff88)}
.login-shell{min-height:clamp(620px,calc(100vh - 188px),820px);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);direction:ltr;overflow:hidden;border:1px solid #2e68e8;border-radius:30px;background:#03091f;box-shadow:0 0 0 1px #7b35ff22,0 0 35px #086dff35,0 24px 80px #0009,inset 0 0 45px #123cff12}
.login-art{position:relative;min-width:0;overflow:hidden;direction:rtl;background:radial-gradient(ellipse at 18% 30%,#0878ec66 0,transparent 36%),radial-gradient(ellipse at 80% 80%,#812bff55 0,transparent 42%),linear-gradient(145deg,#02071a,#062465 58%,#03071d)}
.login-art.glass{border:0;border-radius:0;box-shadow:none}
.login-art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 42px,#35caff0a 42px 44px),linear-gradient(90deg,transparent 49.8%,#46b7ff35 50%,transparent 50.2%);z-index:1}
.login-art:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-24%;height:58%;z-index:2;border-radius:50%;border:1px solid #1bbdff55;background:repeating-radial-gradient(ellipse at center,transparent 0 30px,#1a83ff18 31px 32px);transform:perspective(340px) rotateX(58deg);box-shadow:0 -8px 30px #145dff22}
.brand{position:relative;display:flex;align-items:center;gap:18px;z-index:4}
.brand h1{font-size:clamp(28px,3vw,48px);line-height:1.1;letter-spacing:.4px}
.brand p{color:#b9dcff;margin-top:8px;font-size:14px;letter-spacing:.2px}
.login-art .brand{position:absolute;top:36px;right:38px}
.login-art .brand .logo{width:82px;height:82px}
.orbit{position:absolute;width:min(43vw,540px);aspect-ratio:1;border-radius:50%;border:1px solid #20baff44;left:4%;top:16%;transform:translateX(-50%);box-shadow:0 0 80px #006eff30,inset 0 0 65px #008aff18;z-index:0}
.orbit:before,.orbit:after{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid #778dff38;transform:rotate(48deg) scaleX(.62)}
.orbit:after{transform:rotate(-48deg) scaleX(.62)}
.planet{position:absolute;width:58%;aspect-ratio:1;left:-13%;top:7%;border-radius:50%;z-index:0;background:radial-gradient(circle at 68% 32%,#43c8ff30 0 4%,transparent 5%),radial-gradient(circle at 35% 65%,#235dff35 0 8%,transparent 9%),repeating-linear-gradient(0deg,transparent 0 11px,#45baff0b 12px 13px),radial-gradient(circle at 60% 38%,#0a59c94d,#06183f66 58%,#030819 72%);border:1px solid #2caaff38;box-shadow:inset -30px -20px 70px #020615b3,0 0 70px #008dff30}
.art-word{position:absolute;left:48%;top:50%;transform:translate(-50%,-50%);font-size:clamp(74px,11vw,160px);font-weight:900;letter-spacing:8px;color:#32a9ff12;text-shadow:0 0 55px #006aff35;z-index:0;direction:ltr}
.login-robot{position:absolute;left:-3%;bottom:-3%;height:91%;width:auto;max-width:77%;object-fit:contain;object-position:bottom;z-index:3;opacity:.97;filter:drop-shadow(0 0 30px rgba(0,145,255,.45));pointer-events:none;mix-blend-mode:screen}
.skyline{position:absolute;left:0;right:0;bottom:0;height:29%;z-index:2;overflow:hidden;background:linear-gradient(0deg,#040823 0,#071334 58%,transparent);pointer-events:none}
.skyline:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0009,transparent 70%)}
.skyline span{position:absolute;bottom:0;width:9%;height:66%;background:linear-gradient(90deg,#06112f,#102d66 50%,#07143b);border-top:1px solid #2aaaff88;box-shadow:0 0 18px #147dff44}
.skyline span:after{content:"";position:absolute;inset:12% 18%;background:repeating-linear-gradient(0deg,#33c7ff77 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,transparent 0 7px,#33c7ff55 7px 9px);opacity:.65}
.skyline span:nth-child(1){left:2%;height:42%;width:8%}.skyline span:nth-child(2){left:11%;height:69%;width:9%}.skyline span:nth-child(3){left:21%;height:52%;width:11%}.skyline span:nth-child(4){left:33%;height:82%;width:8%}.skyline span:nth-child(5){left:42%;height:59%;width:12%}.skyline span:nth-child(6){left:55%;height:74%;width:8%}.skyline span:nth-child(7){left:64%;height:47%;width:10%}.skyline span:nth-child(8){left:75%;height:86%;width:9%}.skyline span:nth-child(9){left:85%;height:61%;width:12%}.skyline span:nth-child(10){left:69%;height:38%;width:7%;opacity:.65}.skyline span:nth-child(11){left:27%;height:35%;width:7%;opacity:.65}.skyline span:nth-child(12){left:92%;height:38%;width:7%;opacity:.65}
.art-footer{position:absolute;bottom:18px;right:24px;left:24px;z-index:4;display:flex;justify-content:space-between;align-items:center;color:#9ccfff;font-size:11px;letter-spacing:.3px}
.art-footer span:last-child{direction:ltr;color:#72dfff}
.login-panel{position:relative;display:flex;flex-direction:column;justify-content:center;direction:rtl;padding:clamp(30px,4vw,62px);overflow:hidden;background:linear-gradient(145deg,rgba(7,22,59,.97),rgba(4,11,35,.99))}
.login-panel.glass{border:0;border-inline-start:1px solid #2c62cf;border-radius:0;box-shadow:inset 18px 0 50px #075dff0d}
