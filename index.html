<script>
function slidePill(pill, target){
  const host = pill.parentElement;
  const h = host.getBoundingClientRect();
  const r = target.getBoundingClientRect();
  const to = { l: r.left-h.left, t: r.top-h.top, r: h.right-r.right, b: h.bottom-r.bottom };
  const prev = pill._st || { ...to };
  pill._st = prev;
  gsap.killTweensOf(prev);
  const vertical = Math.abs(to.t-prev.t) > Math.abs(to.l-prev.l);
  const fwd = vertical ? to.t>prev.t : to.l>prev.l;
  const [lead, trail] = vertical ? (fwd?['b','t']:['t','b']) : (fwd?['r','l']:['l','r']);
  const clip = (st)=> `inset(${st.t}px ${st.r}px ${st.b}px ${st.l}px round 14px)`;
  const paint = ()=> gsap.set(pill,{clipPath:clip(prev)});
  gsap.to(prev,{[lead]:to[lead],duration:0.36,ease:'power3.out',onUpdate:paint});
  gsap.to(prev,{[trail]:to[trail],duration:0.55,ease:'power3.inOut',onUpdate:paint});
}
document.querySelectorAll('.misk-nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    slidePill(document.getElementById('nav-pill'), item);
  });
});
</script>
