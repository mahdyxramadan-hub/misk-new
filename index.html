<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISK - نظام إدارة الصيانة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:#0f172a;color:#fff}
.hidden{display:none!important}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.login-card{background:#fff;color:#111;width:100%;max-width:400px;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.login-card h1{text-align:center;margin:0 0 5px;font-size:28px}
.login-card p{text-align:center;color:#666;margin:0 0 20px}
.login-card label{display:block;margin:12px 0 6px;font-weight:700}
.login-card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none}
.login-card input:focus{border-color:#2563eb}
.btn{border:none;cursor:pointer;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px}
.btn.primary{width:100%;background:#2563eb;color:#fff;margin-top:18px;padding:14px}
.btn.primary:hover{background:#1d4ed8}
.btn.small{padding:8px 12px;font-size:13px}
.btn.white{background:#fff;color:#111}
.btn.green{background:#16a34a;color:#fff}
.btn.red{background:#dc2626;color:#fff}
.btn.orange{background:#ea580c;color:#fff}
.topbar{background:#fff;color:#111;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.profile{display:flex;align-items:center;gap:10px}
.profilepic{width:44px;height:44px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.profile b{display:block}
.profile small{color:#666}
.main{padding:20px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;color:#111;border-radius:16px;padding:16px;text-align:center}
.card b{font-size:28px;display:block}
.card span{color:#666;font-size:13px}
.toolbar{background:#fff;color:#111;border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #ddd;border-radius:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:999px;border:none;cursor:pointer}
.tab.active{background:#fff;color:#111;font-weight:800}
.job{background:#fff;color:#111;border-radius:16px;padding:16px;margin-bottom:12px}
.job h3{margin:0 0 8px}
.job .meta{color:#555;font-size:14px;line-height:1.8}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#dbeafe}
.badge.done{background:#dcfce7}
.badge.problem{background:#fee2e2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;color:#111;width:100%;max-width:520px;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:200}
#toast.show{display:block}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:span 2}}
</style>
</head>
<body>
<!-- شاشة الدخول -->
<div id="loginScreen" class="screen active">
<div class="login-wrap"><div class="login-card">
<h1>🛠️ MISK</h1><p>نظام إدارة الصيانة</p>
<label>اسم المستخدم أو رقم الموبايل</label>
<input id="user" placeholder="اكتب اسمك او رقمك" autocomplete="username">
<label>كلمة المرور</label>
<input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
<button class="btn primary" onclick="login()">تسجيل الدخول</button>
<div id="loginMsg" style="color:#dc2626;text-align:center;margin-top:10px;min-height:20px"></div>
<div style="text-align:center;color:#888;font-size:12px;margin-top:10px">لو نسيت الباسورد كلم المدير</div>
</div></div>
</div>
<!-- الداشبورد -->
<div id="dashboardScreen" class="screen">
<div class="topbar">
<div class="profile"><div class="profilepic" id="profileLetter">م</div><div><b id="profileName">...</b><small id="profileRole">...</small></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn small" style="background:#eef2ff" onclick="openPassModal()">🔑 تغيير الباسورد</button>
<button class="btn small red" onclick="logout()">تسجيل الخروج</button>
</div>
</div>
<div class="main">
<div class="cards">
<div class="card"><b id="cDone">0</b><span>تم التسليم</span></div>
<div class="card"><b id="cPending">0</b><span>قيد التنفيذ</span></div>
<div class="card"><b id="cProblem">0</b><span>مشاكل</span></div>
</div>
<div class="toolbar">
<input id="searchInput" placeholder="🔍 ابحث بالاسم أو السيريال أو رقم الأوردر..." oninput="onSearch()">
<button class="btn green" onclick="showSection('jobs')">🧰 الشغل</button>
<button class="btn orange" onclick="showSection('warehouse')">📦 المخزن</button>
<button class="btn white" onclick="showSection('techs')">👨‍🔧 الفنيين</button>
</div>
<div class="tabs" id="filterTabs">
<button class="tab active" onclick="filterByCircle('all',this)">الكل</button>
<button class="tab" onclick="filterByCircle('pending',this)">قيد التنفيذ</button>
<button class="tab" onclick="filterByCircle('done',this)">تم التسليم</button>
<button class="tab" onclick="filterByCircle('problem',this)">مشاكل</button>
</div>
<div id="welcome" style="background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px"></div>
<div id="techInfo"></div>
<div id="adminAdd"></div>
<div id="jobsList"></div>
<div id="loadMoreWrap" style="text-align:center;margin:12px 0"></div>
<div id="warehouseSection" class="hidden">
<div id="warehouseSummary" style="background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px"></div>
<div id="warehouseList"></div>
<div id="warehousePreview"></div>
<div id="stockAlerts"></div>
</div>
<div id="techSection" class="hidden">
<div style="background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px">إجمالي الفنيين: <b id="techCount">0</b></div>
<div id="techList"></div>
</div>
<div id="archiveNav"></div>
<div id="superDeleteBox"></div>
</div>
</div>
<!-- المودالات -->
<div id="details" class="modal"><div class="modal-box"><h3 id="detailsTitle">تفاصيل الأوردر</h3><div id="detailsBody"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" style="width:auto;margin:0" onclick="closeDetails()">إغلاق</button></div></div></div>
<div id="upDownModal" class="modal"><div class="modal-box"><h3>تحديث الحالة</h3><select id="upDownSelect"><option>جديد</option><option>تم الاستلام</option><option>قيد التنفيذ</option><option>تم التسليم</option><option>مشكلة</option></select><button class="btn primary" onclick="saveUpDown()">حفظ</button><button class="btn" onclick="closeModal('upDownModal')">إلغاء</button></div></div>
<div id="recipientModal" class="modal"><div class="modal-box"><h3>بيانات المستلم</h3><input id="recipientName" placeholder="اسم المستلم"><input id="recipientPhone" placeholder="رقم المستلم"><button class="btn primary" onclick="saveRecipient()">حفظ</button><button class="btn" onclick="closeModal('recipientModal')">إلغاء</button></div></div>
<div id="statusModal" class="modal"><div class="modal-box"><h3>تغيير الحالة</h3><div id="statusModalBody"></div><button class="btn" onclick="closeModal('statusModal')">إغلاق</button></div></div>
<div id="photoCamModal" class="modal"><div class="modal-box"><h3>تصوير</h3><video id="camVideo" autoplay playsinline style="width:100%;border-radius:12px;background:#000"></video><button class="btn primary" onclick="capturePhoto()">📸 التقاط</button><button class="btn" onclick="closeModal('photoCamModal')">إغلاق</button></div></div>
<div id="photoModal" class="modal"><div class="modal-box" style="text-align:center"><img id="photoModalImg" style="width:100%;border-radius:12px"><button class="btn" onclick="closeModal('photoModal')">إغلاق</button></div></div>
<div id="azkarModal" class="modal"><div class="modal-box"><h3>📿 الأذكار</h3><div id="azkarFull" style="line-height:2"></div><button class="btn" onclick="closeModal('azkarModal')">إغلاق</button></div></div>
<div id="passModal" class="modal"><div class="modal-box"><h3>🔑 غير الباسورد</h3><p style="color:#666">غير الباسورد الافتراضي لباسورد خاص بيك</p><input id="newPassInput" type="password" placeholder="الباسورد الجديد"><button class="btn primary" onclick="doChangePass()">حفظ الباسورد الجديد</button><button class="btn" onclick="closePassModal()">تخطي لاحقا</button></div></div>
<input type="file" id="photoInput" accept="image/*" style="display:none">
<input type="file" id="photoGalleryInput" accept="image/*" style="display:none">
<div id="uploadingBanner" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#2563eb;color:#fff;padding:10px 18px;border-radius:999px;z-index:300">جاري الرفع...</div>
<div id="toast"></div>
<script>
const SUPABASE_URL = "https://wpbjdxjozibqcoyrmxlc.supabase.co";
const SUPABASE_KEY = "sb_publishable_EpBDoKSZQ6OMZA3wHKd8vg_9_ocCNnm";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "job_photos"; const TABLE = "jobs"; const ARCHIVE_TABLE = "jobs_archive"; const WAREHOUSE_TABLE = "warehouse";
let userObj = null, allJobs = [], allWarehouse = [], allTechs = [], searchQ = "", activeFilter = "all", currentSection = "jobs", currentDetailId = null, visibleCount = 10;

function toast(msg){ let t=document.getElementById('toast'); if(!t) return alert(msg); t.textContent=msg; t.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
function closeModal(id){ let m=document.getElementById(id); if(m) m.classList.remove('open'); }
function openModal(id){ let m=document.getElementById(id); if(m) m.classList.add('open'); }
function showLogin(){ document.getElementById('dashboardScreen').classList.remove('active'); document.getElementById('loginScreen').classList.add('active'); }
function showDashboard(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('dashboardScreen').classList.add('active');
  if(userObj){
    let pn=document.getElementById('profileName'); if(pn) pn.textContent=userObj.name||userObj.username||'...';
    let pr=document.getElementById('profileRole'); if(pr) pr.textContent=userObj.role||'';
    let pl=document.getElementById('profileLetter'); if(pl) pl.textContent=(userObj.name||'م').charAt(0);
    let w=document.getElementById('welcome'); if(w) w.innerHTML='أهلا بيك يا <b>'+(userObj.name||userObj.username)+'</b> 👋 &nbsp;|&nbsp; دورك: '+(userObj.role||'');
    toast('أهلا بيك يا '+(userObj.name||userObj.username));
  }
}
function normTechKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function getJobTech(j){ return j.technician||j.tech||j.tech_name||''; }
function techDisplayName(t){ return (t.name||t.username||'').trim(); }
function getRoleFromDb(t){ return (t.role||'tech'); }

async function login(e){
  if(e) e.preventDefault();
  let uEl=document.getElementById('user'), pEl=document.getElementById('pass');
  let u=(uEl?uEl.value:'').trim().toLowerCase();
  let p=(pEl?pEl.value:'').trim();
  let msgEl=document.getElementById('loginMsg'); if(msgEl) msgEl.innerText='جاري...';
  if(!u||!p){ if(msgEl) msgEl.innerText='اكتب الاسم والباسورد'; return false; }
  try{
    let res=await supabaseClient.from('technicians').select('*');
    if(res.error||!res.data){ if(msgEl) msgEl.innerText='خطأ: '+(res.error?res.error.message:'مفيش داتا'); return false; }
    let found=res.data.find(t=>{
      let userInDb=String(t.username||'').trim().toLowerCase();
      let nameInDb=String(t.name||'').trim().toLowerCase().replace(/[\s_]+/g,'');
      let phoneInDb=String(t.phone||'').trim();
      let inputClean=u.replace(/[\s_]+/g,'');
      return ((userInDb===u)||(nameInDb===inputClean)||(phoneInDb===u)) && String(t.password||'').trim()===p;
    });
    if(!found){ if(msgEl) msgEl.innerText='الاسم مش موجود او الباسورد غلط'; return false; }
    let role=getRoleFromDb(found);
    userObj={id:found.id, username:found.username, name:techDisplayName(found), role:role, isAdmin:(role==="admin"||role==="super_admin"), isSuper:(role==="super_admin")};
    localStorage.setItem('misk_user', JSON.stringify(userObj));
    localStorage.setItem('misk_pass', p);
    if(msgEl) msgEl.innerText='';
    afterLogin();
  }catch(err){ if(msgEl) msgEl.innerText='خطأ: '+err.message; }
  return false;
}
function afterLogin(){
  showDashboard(); loadJobs(); loadWarehouse(); loadTechs();
  if(!localStorage.getItem("misk_pass_changed_"+userObj.username)) openModal("passModal");
}
function logout(){ Object.keys(localStorage).forEach(k=>{ if(k.startsWith("misk_")) localStorage.removeItem(k); }); location.reload(); }
function openPassModal(){ openModal("passModal"); }
function closePassModal(){ closeModal("passModal"); }
async function doChangePass(){
  let np=document.getElementById("newPassInput").value.trim(); if(!np) return alert("اكتب الباسورد الجديد");
  if(!userObj) return alert("سجل دخول الأول");
  let r=await supabaseClient.from("technicians").update({password:np}).eq("id", userObj.id);
  if(r.error) return alert("خطأ: "+r.error.message);
  localStorage.setItem("misk_pass_changed_"+userObj.username,"1"); localStorage.setItem("misk_pass", np);
  closePassModal(); alert("تم تغيير الباسورد");
}
async function loadJobs(){
  let r=await supabaseClient.from(TABLE).select("*").order("created_at",{ascending:false}).limit(1000);
  allJobs=r.data||[]; renderJobs();
}
async function loadWarehouse(){
  let r=await supabaseClient.from(WAREHOUSE_TABLE).select("*").order("created_at",{ascending:false}).limit(500);
  allWarehouse=r.data||[];
  let el=document.getElementById("warehouseSummary"); if(el) el.innerHTML='📦 إجمالي المخزن: <b>'+allWarehouse.length+'</b> قطعة';
  let wl=document.getElementById("warehouseList"); if(wl) wl.innerHTML=allWarehouse.map(w=>'<div class="job"><h3>'+(w.name||w.item||'قطعة')+'</h3><div class="meta">الكمية: '+(w.qty||w.quantity||0)+' | الكود: '+(w.code||w.serial||'-')+'</div></div>').join('')||'<div class="job">المخزن فاضي</div>';
}
async function loadTechs(){
  let r=await supabaseClient.from('technicians').select('*');
  allTechs=r.data||[];
  let tc=document.getElementById("techCount"); if(tc) tc.innerText=allTechs.length;
  let tl=document.getElementById("techList"); if(tl) tl.innerHTML=allTechs.map(t=>'<div class="job"><h3>'+(t.name||t.username)+'</h3><div class="meta">الدور: '+(t.role||'tech')+' | الموبايل: '+(t.phone||'-')+'</div></div>').join('');
}
function myJobsBase(){
  if(!userObj) return [];
  if(userObj.isAdmin) return allJobs;
  return allJobs.filter(j=> normTechKey(getJobTech(j))===normTechKey(userObj.name));
}
function renderJobs(){
  let list=document.getElementById("jobsList"); if(!list) return;
  let mine=myJobsBase();
  let jobs=[...mine];
  if(activeFilter==='pending') jobs=jobs.filter(j=>j.status!=="تم التسليم");
  if(activeFilter==='done') jobs=jobs.filter(j=>j.status==="تم التسليم");
  if(activeFilter==='problem') jobs=jobs.filter(j=>j.status==="مشكلة");
  if(searchQ) jobs=jobs.filter(j=> ((j.customer_name||"")+" "+(j.serial||"")+" "+(j.order||"")+" "+(j.mobile||"")).toLowerCase().includes(searchQ.toLowerCase()));
  let cd=document.getElementById("cDone"); if(cd) cd.innerText=mine.filter(j=>j.status==="تم التسليم").length;
  let cp=document.getElementById("cPending"); if(cp) cp.innerText=mine.filter(j=>j.status!=="تم التسليم").length;
  let cpr=document.getElementById("cProblem"); if(cpr) cpr.innerText=mine.filter(j=>j.status==="مشكلة").length;
  list.innerHTML=jobs.slice(0,visibleCount).map(j=>'<div class="job"><h3>'+(j.customer_name||"بدون اسم")+' - '+(j.order||"")+'</h3><div class="meta">📍 '+(j.address||"-")+'<br>📞 '+(j.mobile||"-")+' | 🔢 '+(j.serial||"لسه")+' | الحالة: <b>'+(j.status||"جديد")+'</b><br>👨‍🔧 الفني: '+(getJobTech(j)||"-")+'</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small green" onclick="openDetails(\''+j.id+'\')">تفاصيل</button><button class="btn small" style="background:#eef2ff" onclick="openUpDown(\''+j.id+'\')">تحديث الحالة</button></div></div>').join('')||'<div class="job" style="text-align:center">مفيش شغل هنا</div>';
  let w=document.getElementById("loadMoreWrap"); if(w) w.innerHTML= jobs.length>visibleCount ? '<button class="btn white" onclick="visibleCount+=20;renderJobs()">عرض المزيد</button>' : "";
}
function onSearch(){ let s=document.getElementById("searchInput"); searchQ=s?s.value:""; renderJobs(); }
function filterByCircle(f,btn){ activeFilter=f; visibleCount=10; document.querySelectorAll('#filterTabs .tab').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); renderJobs(); }
function showSection(sec){
  currentSection=sec;
  document.getElementById("jobsList").classList.toggle("hidden", sec!=="jobs");
  document.getElementById("loadMoreWrap").classList.toggle("hidden", sec!=="jobs");
  document.getElementById("filterTabs").classList.toggle("hidden", sec!=="jobs");
  document.getElementById("warehouseSection").classList.toggle("hidden", sec!=="warehouse");
  document.getElementById("techSection").classList.toggle("hidden", sec!=="techs");
  if(sec==="warehouse") loadWarehouse();
  if(sec==="techs") loadTechs();
}
function openDetails(id){
  currentDetailId=id;
  let j=allJobs.find(x=>String(x.id)===String(id)); if(!j) return;
  document.getElementById("detailsTitle").innerText=(j.customer_name||"")+" - "+(j.order||"");
  document.getElementById("detailsBody").innerHTML='<p>📍 العنوان: '+(j.address||"-")+'</p><p>📞 الموبايل: '+(j.mobile||"-")+'</p><p>🔢 السيريال: '+(j.serial||"-")+'</p><p>الحالة: <b>'+(j.status||"جديد")+'</b></p><p>الفني: '+(getJobTech(j)||"-")+'</p><p>ملاحظات: '+(j.notes||"-")+'</p>';
  openModal("details");
}
function closeDetails(){ closeModal("details"); }
function openUpDown(id){ currentDetailId=id; openModal("upDownModal"); }
async function saveUpDown(){
  if(!currentDetailId) return;
  let st=document.getElementById("upDownSelect").value;
  let r=await supabaseClient.from(TABLE).update({status:st}).eq("id", currentDetailId);
  if(r.error) return alert("خطأ: "+r.error.message);
  closeModal("upDownModal"); loadJobs(); toast("تم تحديث الحالة");
}
function saveRecipient(){ closeModal("recipientModal"); toast("تم حفظ المستلم"); }
function capturePhoto(){ closeModal("photoCamModal"); toast("تم التقاط الصورة"); }
let saved=localStorage.getItem('misk_user');
if(saved){ try{ userObj=JSON.parse(saved); showDashboard(); loadJobs(); loadWarehouse(); loadTechs(); }catch(e){ localStorage.removeItem('misk_user'); } }
let passEl=document.getElementById('pass');
if(passEl) passEl.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
