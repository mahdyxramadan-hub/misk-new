<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MISK SYSTEM</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,#00e5ff44,transparent 20%),
    radial-gradient(circle at bottom right,#7b2cff66,transparent 30%),
    linear-gradient(135deg,#050816,#091425,#180726);

    position:relative;
}

/* الخلفية */

body::before{
    content:"";
    position:absolute;
    width:1200px;
    height:1200px;

    background:
    radial-gradient(circle,#00e5ff22,transparent 70%);

    animation:rotateBg 30s linear infinite;
}

@keyframes rotateBg{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* الدائرة الرئيسية */

.ai-core{

    position:absolute;

    top:80px;

    width:280px;

    height:280px;

    border-radius:50%;

    background:
    radial-gradient(circle,#9cf7ff,#4499ff,#152840);

    box-shadow:
    0 0 60px #00e5ff,
    0 0 120px #6f2cff;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:2;
}

.ai-core::after{

    content:"";

    width:220px;

    height:220px;

    border:2px solid rgba(255,255,255,.3);

    border-radius:50%;
}

/* البطاقة */

.login-card{

    width:470px;

    padding:40px;

    z-index:5;

    border-radius:35px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 35px rgba(0,229,255,.15);

}

/* شعار */

.logo{

    text-align:center;

    margin-bottom:25px;
}

.logo h1{

    color:white;

    font-size:40px;

    letter-spacing:3px;
}

.logo p{

    color:#cfd8e3;

    margin-top:8px;
}

/* حقول الإدخال */

.input-box{

    margin-bottom:18px;

    position:relative;
}

.input-box i{

    position:absolute;

    left:18px;

    top:20px;

    color:#00e5ff;
}

.input-box input{

    width:100%;
    height:60px;

    border:none;

    outline:none;

    border-radius:20px;

    color:white;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    padding-right:20px;

    padding-left:50px;

    font-size:16px;
}

.input-box input:focus{

    border-color:#00e5ff;

    box-shadow:0 0 20px rgba(0,229,255,.4);
}

/* الخيارات */

.login-options{

    display:flex;

    justify-content:space-between;

    color:white;

    font-size:14px;

    margin-bottom:25px;
}

.login-options a{
    color:#57dfff;
    text-decoration:none;
}

/* زر الدخول */

.login-btn{

    width:100%;
    height:62px;

    border:none;

    border-radius:25px;

    cursor:pointer;

    font-size:22px;

    font-weight:700;

    color:white;

    background:
    linear-gradient(
    90deg,
    #00e5ff,
    #6f2cff,
    #ff4fd8
    );

    box-shadow:
    0 0 25px rgba(0,229,255,.4),
    0 0 50px rgba(111,44,255,.3);

    transition:.3s;
}

.login-btn:hover{

    transform:translateY(-3px) scale(1.02);
}

/* زر الدعم */

.support{

    margin-top:20px;

    text-align:center;

    color:#c7d0db;
}

.support i{

    color:#00e5ff;
}

@media(max-width:600px){

.login-card{

    width:92%;
    padding:25px;
}

.ai-core{

    width:170px;
    height:170px;
    top:50px;
}

}

</style>
</head>

<body>

<div class="ai-core"></div>

<div class="login-card">

    <div class="logo">

        <h1>MISK</h1>

        <p>نظام إدارة الأعطال والصيانة</p>

    </div>

    <div class="input-box">

        <i class="fas fa-user"></i>

        <input
        id="username"
        type="text"
        placeholder="رقم الهاتف">
    </div>

    <div class="input-box">

        <i class="fas fa-lock"></i>

        <input
        id="password"
        type="password"
        placeholder="كلمة المرور">
    </div>

    <div class="login-options">

        <label>
            <input type="checkbox">
            تذكرني
        </label>

        <a href="#">
            نسيت كلمة المرور؟
        </a>

    </div>

    <button
    class="login-btn"
    onclick="login()">

        تسجيل الدخول

    </button>

    <div class="support">

        <i class="fas fa-headset"></i>

        MISK SYSTEM V3

    </div>

</div>

<script>

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    console.log(username,password);

    /* اربط هنا دالة تسجيل الدخول الحالية */

}

</script>

</body>
</html>
