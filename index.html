<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MISK Login</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma}body{margin:0;min-height:100vh;background:#0f1115;color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:360px;background:#1a1d24;border:1px solid #2a2e39;border-radius:18px;padding:30px;text-align:center}.logo{width:70px;height:70px;background:linear-gradient(135deg,#ff2ea6,#00c6ff);border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#0f1115;color:#fff;outline:none}button{width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}a{color:#888;font-size:13px;text-decoration:none}</style></head>
<body><div class="card"><div class="logo">M</div><h2 style="margin:12px 0 4px">Welcome Back</h2><p style="color:#888;font-size:14px;margin:0 0 16px">Sign in to MISK Technology</p><input placeholder="Username"><input type="password" placeholder="Password"><button onclick="alert('تم الدخول')">Sign In</button><p style="margin-top:14px"><a href="#">Forgot password?</a></p></div></body></html>
