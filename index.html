<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MISK - Login</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma}body{margin:0;min-height:100vh;background:#050816;color:#fff;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(circle at 20% 20%,#1a0b3d 0%,transparent 40%),radial-gradient(circle at 80% 80%,#0e2a5a 0%,transparent 40%)}
.card{width:380px;background:rgba(20,25,70,.85);border:1px solid rgba(0,198,255,.5);border-radius:24px;padding:28px;box-shadow:0 0 40px rgba(0,150,255,.4);text-align:center}
.logo{font-size:34px;font-weight:900}.logo span{color:#00c6ff}input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;outline:none}input::placeholder{color:#aaa}button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff2ea6,#00c6ff);color:#fff;font-weight:800;font-size:17px;margin-top:10px;cursor:pointer}.row{display:flex;justify-content:space-between;font-size:13px;margin:8px 0}.row a{color:#00c6ff;text-decoration:none}</style></head>
<body><div class="card"><div class="logo">MISK <span>Technology</span></div><p style="color:#ccc">Together for a smarter future</p><h2>تسجيل الدخول</h2><p style="color:#aaa;font-size:14px">مرحباً بك في نظام MISK</p><input placeholder="👤 اسم المستخدم"><input type="password" placeholder="🔒 كلمة المرور"><div class="row"><label><input type="checkbox" style="width:auto"> تذكرني</label><a href="#">نسيت كلمة المرور؟</a></div><button onclick="alert('تم الدخول')">دخول النظام ←</button><p style="font-size:12px;color:#888;margin-top:14px">MISK Technology © 2025</p></div></body></html>
