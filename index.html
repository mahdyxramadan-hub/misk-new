<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WE - Login</title>
<style>*{box-sizing:border-box;font-family:Tahoma}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#1a1a2e,#4A0E68);display:flex;align-items:center;justify-content:center;color:#111}
.card{width:380px;background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}h1{font-size:32px;margin:0}h1 span{color:#E6007E}.sub{color:#777;font-size:13px}input{width:100%;padding:14px;margin:8px 0;border-radius:50px;border:1px solid #ddd;outline:none;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:50px;background:#4A0E68;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}button:hover{background:#E6007E}.row{display:flex;justify-content:space-between;font-size:13px;margin:8px}.row a{color:#E6007E;text-decoration:none}</style></head>
<body><div class="card"><h1>MISK <span>WE</span></h1><p class="sub">نظام إدارة الأوردرات والمخزن</p><h2>تسجيل الدخول</h2><input placeholder="اسم المستخدم"><input type="password" placeholder="كلمة المرور"><div class="row"><label><input type="checkbox" style="width:auto"> تذكرني</label><a href="#">نسيت كلمة المرور؟</a></div><button onclick="alert('تم الدخول')">دخول ←</button></div></body></html>
