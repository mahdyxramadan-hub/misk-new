<style>
  /* اخفي أي زرار مهمة جديدة بره المهام */
  body:not(.on-tasks) button[data-new-task] { display:none !important; }
</style>

<script>
/* شيل زرار مهمة جديدة من كل حتة وسيبه في المهام بس */
function fixNewTaskBtn(){
  document.querySelectorAll('button, a, div').forEach(function(el){
    if(el.textContent.trim() === '+ مهمة جديدة' || el.textContent.trim() === 'مهمة جديدة'){
      // لو الزرار جوه صفحة المهام سيبه، لو بره امسحه
      var inTasks = el.closest('#tasksPage, #jobsList, [data-tab="pending"], #pendingTab');
      // وكمان لو احنا واقفين على تاب المهام سيبه
      var isTasksTab = document.body.classList.contains('on-tasks');
      if(!inTasks && !isTasksTab){
        // لو ده الزرار الأصلي بتاعنا اللي في المهام، متلمسوش
        if(el.id === 'onlyNewTaskBtn') return;
        el.style.display = 'none';
        el.remove();
      }
    }
  });
}
// راقبه كل شوية لأن dashboard.js بيرسمه بعد التحميل
setInterval(fixNewTaskBtn, 300);

// لما تدوس على المهام، علّم الجسم اننا في المهام عشان الزرار يظهر
var oldShowTab = window.showTab;
window.showTab = function(tab, el){
  if(tab === 'pending') document.body.classList.add('on-tasks');
  else document.body.classList.remove('on-tasks');
  if(oldShowTab) return oldShowTab(tab, el);
};
</script>
</body>
